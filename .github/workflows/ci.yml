name: IntelliVend Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 httpx sqlalchemy pydantic fastapi uvicorn lightgbm torch torchvision scikit-learn mlflow

      - name: Lint Code with Flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Pytest Test Suite
        run: |
          pytest backend/agentic-layer/tests/test_agent_guardrails.py
          pytest backend/order-service/tests/test_orders.py

  build-docker-images:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Inventory Service Docker Image
        run: |
          docker build -t intellivend/inventory-service:latest ./backend/inventory-service

      - name: Build Agentic Layer Docker Image
        run: |
          docker build -t intellivend/agentic-layer:latest ./backend/agentic-layer
