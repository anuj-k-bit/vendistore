apiVersion: v1
kind: Namespace
metadata:
  name: intellivend
---
# ----------------------------------------------------
# PostgreSQL Database Deployment & Service
# ----------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
  namespace: intellivend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: "intellivend"
            - name: POSTGRES_PASSWORD
              value: "secretpassword"
            - name: POSTGRES_DB
              value: "intellivend_db"
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: intellivend
spec:
  selector:
    app: postgres-db
  ports:
    - port: 5432
      targetPort: 5432
---
# ----------------------------------------------------
# Demand Forecasting ML Service Deployment
# ----------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecast-service
  namespace: intellivend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forecast-service
  template:
    metadata:
      labels:
        app: forecast-service
    spec:
      containers:
        - name: forecast-service
          image: intellivend/forecast-service:latest
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          ports:
            - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: forecast-service
  namespace: intellivend
spec:
  selector:
    app: forecast-service
  ports:
    - port: 8082
      targetPort: 8082
---
