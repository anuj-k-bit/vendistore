global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "inventory-service"
    static_configs:
      - targets: ["inventory-service:8080"]

  - job_name: "order-service"
    static_configs:
      - targets: ["order-service:8081"]

  - job_name: "forecast-service"
    static_configs:
      - targets: ["forecast-service:8082"]

  - job_name: "vision-service"
    static_configs:
      - targets: ["vision-service:8083"]

  - job_name: "pricing-service"
    static_configs:
      - targets: ["pricing-service:8084"]

  - job_name: "recommendation-service"
    static_configs:
      - targets: ["recommendation-service:8085"]

  - job_name: "agentic-layer"
    static_configs:
      - targets: ["agentic-layer:8086"]
